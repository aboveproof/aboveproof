name: Generate Contribution Snake

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate cosmic contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=8250df&color_dots=#ebedf0,#cfe2ff,#8cb8ff,#3b82f6,#0969da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=a371f7&color_dots=#161b22,#1f355c,#2c5499,#58a6ff,#79c0ff

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
