<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="aboveproof — I make things and wonder about the universe.">
  <defs>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f1f5ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>

    <radialGradient id="nebulaAL" cx="78%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaBL" cx="62%" cy="82%" r="36%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <linearGradient id="accentTextL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>

    <clipPath id="cardClipL">
      <rect x="0.75" y="0.75" width="898.5" height="258.5" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .twinkle-a { animation: twinkle 3.6s ease-in-out infinite; }
    .twinkle-b { animation: twinkle 5.1s ease-in-out 1.4s infinite; }
    .twinkle-c { animation: twinkle 4.4s ease-in-out 2.7s infinite; }
    .pulse { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spin-slow { animation: spin 28s linear infinite; transform-origin: 730px 130px; }
    .spin-rev { animation: spinRev 19s linear infinite; transform-origin: 730px 130px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.9; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.82; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
  </style>

  <g clip-path="url(#cardClipL)">
    <rect width="900" height="260" fill="url(#bgL)"/>
    <rect width="900" height="260" fill="url(#nebulaAL)"/>
    <rect width="900" height="260" fill="url(#nebulaBL)"/>

    <g stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="1">
      <line x1="0" y1="65" x2="900" y2="65"/>
      <line x1="0" y1="195" x2="900" y2="195"/>
      <line x1="590" y1="0" x2="590" y2="260"/>
    </g>

    <g fill="#4f46e5">
      <circle cx="48" cy="34" r="1.2" class="twinkle-a"/>
      <circle cx="244" cy="38" r="1.2" class="twinkle-b"/>
      <circle cx="465" cy="46" r="1.3" class="twinkle-c"/>
      <circle cx="534" cy="28" r="1.1" class="twinkle-a"/>
      <circle cx="615" cy="40" r="1.4" class="twinkle-b"/>
      <circle cx="812" cy="34" r="1.5" class="twinkle-a"/>
      <circle cx="864" cy="68" r="1.1" class="twinkle-c"/>
      <circle cx="848" cy="196" r="1.3" class="twinkle-b"/>
      <circle cx="640" cy="224" r="1.2" class="twinkle-a"/>
      <circle cx="660" cy="178" r="1.1" class="twinkle-b"/>
    </g>

    <g stroke="#0969da" stroke-opacity="0.25" stroke-width="0.9" fill="none">
      <polyline points="534,28 578,56 615,40 652,64"/>
    </g>
    <g fill="#0969da">
      <circle cx="534" cy="28" r="1.7" opacity="0.65"/>
      <circle cx="578" cy="56" r="1.9" opacity="0.8"/>
      <circle cx="615" cy="40" r="1.7" opacity="0.65"/>
      <circle cx="652" cy="64" r="1.5" opacity="0.55"/>
    </g>

    <g>
      <ellipse cx="730" cy="130" rx="112" ry="44" transform="rotate(-24 730 130)" fill="none" stroke="#0969da" stroke-opacity="0.32" stroke-width="1.2"/>
      <ellipse cx="730" cy="130" rx="84" ry="84" fill="none" stroke="#0969da" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 5"/>
      <ellipse cx="730" cy="130" rx="54" ry="54" fill="none" stroke="#8250df" stroke-opacity="0.28" stroke-width="1"/>
      <ellipse cx="730" cy="130" rx="124" ry="124" fill="none" stroke="#cbd5e1" stroke-opacity="0.7" stroke-width="0.9"/>

      <g class="spin-slow">
        <circle cx="814" cy="130" r="3.4" fill="#0969da"/>
        <circle cx="814" cy="130" r="7.5" fill="#0969da" opacity="0.18"/>
      </g>
      <g class="spin-rev">
        <circle cx="730" cy="76" r="2.8" fill="#8250df"/>
        <circle cx="730" cy="76" r="6.5" fill="#8250df" opacity="0.18"/>
      </g>

      <circle cx="730" cy="130" r="26" fill="url(#coreGlowL)" class="pulse"/>
      <circle cx="730" cy="130" r="6" fill="#ffffff"/>
      <path d="M730 113 L732.2 127.8 L747 130 L732.2 132.2 L730 147 L727.8 132.2 L713 130 L727.8 127.8 Z" fill="#0969da" opacity="0.85"/>
    </g>

    <g transform="translate(46, 44)">
      <rect x="0" y="0" width="194" height="24" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="14" cy="12" r="3.5" fill="#0969da" class="twinkle-a"/>
      <text x="26" y="16" class="mono" font-size="11" font-weight="600" fill="#57606a" letter-spacing="1.4">ABOVEPROOF · RICO</text>

      <text x="0" y="66" class="sans" font-size="31" font-weight="700" fill="#1f2328" letter-spacing="-0.6">I make things and wonder</text>
      <text x="0" y="102" class="sans" font-size="31" font-weight="700" fill="url(#accentTextL)" letter-spacing="-0.6">about the universe.</text>

      <text x="0" y="136" class="sans" font-size="13" font-style="italic" fill="#57606a">“The universe is so vast, more vast than we could imagine, but yet somehow we are here.”</text>

      <g transform="translate(0, 158)" class="mono" font-size="11">
        <rect x="0" y="0" width="90" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
        <text x="45" y="16" text-anchor="middle" fill="#0969da">TypeScript</text>

        <rect x="98" y="0" width="66" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
        <text x="131" y="16" text-anchor="middle" fill="#4f46e5">Python</text>

        <rect x="172" y="0" width="106" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
        <text x="225" y="16" text-anchor="middle" fill="#8250df">Desktop Apps</text>

        <rect x="286" y="0" width="124" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
        <text x="348" y="16" text-anchor="middle" fill="#1a7f37">Discord Tooling</text>

        <rect x="418" y="0" width="52" height="24" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
        <text x="444" y="16" text-anchor="middle" fill="#0969da">MCP</text>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="258.5" rx="14" fill="none" stroke="url(#borderGradL)" stroke-width="1.2"/>
</svg>
